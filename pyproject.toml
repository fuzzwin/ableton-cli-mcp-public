[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-ableton"
version = "0.7.0"
description = "Local Ableton Live CLI and MCP tools backed by a main-thread Remote Script"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = ["click>=8.1,<9", "mcp>=1.30,<2", "defusedxml>=0.7,<1", "prompt-toolkit>=3,<4", "jsonschema>=4.20,<5", "anyio>=4.5,<5"]

[project.optional-dependencies]
audio = ["numpy>=2,<3", "scipy>=1.14,<2", "soundfile>=0.13,<1", "pyloudnorm>=0.1,<1", "pedalboard>=0.9.26,<1"]

[project.scripts]
cli-anything-ableton = "cli_anything.ableton.ableton_cli:main"
ableton-mcp = "cli_anything.ableton.mcp_server:main"

[tool.setuptools.packages.find]
include = ["cli_anything.*"]
namespaces = true

[tool.setuptools.package-data]
"cli_anything.ableton" = ["skills/*.md", "README.md", "production/data/*.json"]
